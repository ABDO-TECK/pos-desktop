name: Publish verified Setup artifact
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows Setup validation run to publish
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Bind artifact to the release source tag
        uses: actions/github-script@v7
        env:
          BUILD_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const runId=process.env.BUILD_RUN_ID;
            if(!/^\d+$/.test(runId))throw Error('Invalid build run');
            const {owner,repo}=context.repo;
            const {data:run}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:Number(runId)});
            if(run.conclusion!=='success'||run.path!=='.github/workflows/windows-setup.yml')throw Error('Expected successful Setup workflow');
            const {data:ref}=await github.rest.git.getRef({owner,repo,ref:'tags/v0.0.1'});
            if(ref.object.type!=='commit'||ref.object.sha!==run.head_sha)throw Error('Setup source tag must equal artifact build commit');
            const {data:source}=await github.rest.repos.getContent({owner,repo,path:'version.json',ref:run.head_sha});
            const metadata=JSON.parse(Buffer.from(source.content,'base64'));
            if(metadata.installer_version!=='0.0.1'||metadata.version!=='0.0.8')throw Error('Unexpected initial Setup identity');
            core.info('Verified artifact provenance: '+run.head_sha);
      - uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: release-assets
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify hashes and publish the complete Setup only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),assert=require('assert/strict');
          const expected=['POS-Desktop-Setup-0.0.1.exe','POS-Desktop-Setup-0.0.1.exe.blockmap','latest.yml','SHA256SUMS.txt','deployment-inventory.json'].sort();
          assert.deepEqual(fs.readdirSync('.').sort(),expected);
          assert.equal(JSON.parse(fs.readFileSync('deployment-inventory.json')).version,'0.0.8');
          const metadata=fs.readFileSync('latest.yml','utf8'),bytes=fs.readFileSync('POS-Desktop-Setup-0.0.1.exe');
          assert.match(metadata,/^version: 0\.0\.1\s*$/m);
          assert.ok(metadata.includes(crypto.createHash('sha512').update(bytes).digest('base64')));
          NODE
          printf '%s\n' 'Complete Windows x64 Setup 0.0.1, application update revision 0.0.8, rebuilt with current fixes.' '' 'Signed stable and beta deltas are delivered from https://github.com/ABDO-TECK/pos-desktop-updates.' '' 'Includes embedded PHP, MariaDB, Java and QZ Tray. Business databases and device credentials are outside the install directory.' '' 'This installer has no Windows Authenticode publisher certificate. Physical printer output is not part of automated acceptance.' > ../release-notes.md
          gh release create v0.0.1 ./* --repo "$GITHUB_REPOSITORY" --verify-tag --latest --title 'POS Desktop Setup v0.0.1' --notes-file ../release-notes.md
