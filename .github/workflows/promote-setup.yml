name: Publish verified Setup artifact
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows Setup validation run to publish
        required: true
      source_sha:
        description: Exact reviewed Setup 0.0.14 build commit
        type: string
      artifact_id:
        description: Immutable windows-setup artifact ID from that run
        type: string
      artifact_sha256:
        description: SHA-256 of the immutable artifact archive
        type: string
      setup_sha256:
        description: Verified Setup executable SHA-256 (required for publication)
        type: string
      publish:
        description: Publish verified Setup 0.0.14 as stable and latest
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  publish:
    if: github.ref != 'refs/heads/codex/setup14-promote'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Bind artifact to the release source tag
        uses: actions/github-script@v7
        env:
          BUILD_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const runId=process.env.BUILD_RUN_ID;
            if(!/^\d+$/.test(runId))throw Error('Invalid build run');
            const {owner,repo}=context.repo;
            const {data:run}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:Number(runId)});
            if(run.conclusion!=='success'||run.path!=='.github/workflows/windows-setup.yml')throw Error('Expected successful Setup workflow');
            const {data:ref}=await github.rest.git.getRef({owner,repo,ref:'tags/v0.0.1'});
            if(ref.object.type!=='commit'||ref.object.sha!==run.head_sha)throw Error('Setup source tag must equal artifact build commit');
            const {data:source}=await github.rest.repos.getContent({owner,repo,path:'version.json',ref:run.head_sha});
            const metadata=JSON.parse(Buffer.from(source.content,'base64'));
            if(metadata.installer_version!=='0.0.1'||metadata.version!=='0.0.1'||metadata.application_version!=='0.0.1')throw Error('Unexpected initial Setup identity');
            core.info('Verified artifact provenance: '+run.head_sha);
      - uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: release-assets
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify hashes and publish the complete Setup only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),assert=require('assert/strict');
          const expected=['POS-Desktop-Setup-0.0.1.exe','POS-Desktop-Setup-0.0.1.exe.blockmap','latest.yml','SHA256SUMS.txt','deployment-inventory.json'].sort();
          assert.deepEqual(fs.readdirSync('.').sort(),expected);
          assert.equal(JSON.parse(fs.readFileSync('deployment-inventory.json')).version,'0.0.1');
          const metadata=fs.readFileSync('latest.yml','utf8'),bytes=fs.readFileSync('POS-Desktop-Setup-0.0.1.exe');
          assert.match(metadata,/^version: 0\.0\.1\s*$/m);
          assert.ok(metadata.includes(crypto.createHash('sha512').update(bytes).digest('base64')));
          NODE
          printf '%s\n' 'Complete Windows x64 Setup and application version 0.0.1, rebuilt with current fixes.' '' 'Manual uninstall deletes POS business data, settings and device keys. Upgrades retain data. Reinstall after uninstall creates a fresh administrator and a temporary password.' '' 'Includes POS branding and embedded PHP, MariaDB, Java and QZ Tray. Signed stable and beta deltas use pos-desktop-updates.' '' 'This installer has no Windows Authenticode publisher certificate. Physical printer output is not part of automated acceptance.' > ../release-notes.md
          if gh release view v0.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.0.1 ./* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit v0.0.1 --repo "$GITHUB_REPOSITORY" --latest --title 'POS Desktop Setup v0.0.1' --notes-file ../release-notes.md
          else
            gh release create v0.0.1 ./* --repo "$GITHUB_REPOSITORY" --verify-tag --latest --title 'POS Desktop Setup v0.0.1' --notes-file ../release-notes.md
          fi

  setup14:
    if: github.ref == 'refs/heads/codex/setup14-promote'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-setup-0.0.14
      cancel-in-progress: false
    env:
      RELEASE_TAG: v0.0.14
      SOURCE_SHA: ${{ inputs.source_sha }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
      SETUP_SHA256: ${{ inputs.setup_sha256 }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - name: Verify staged artifact identity and required acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ABDO-TECK/pos-desktop
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$ARTIFACT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          if [[ "$PUBLISH" == true ]]; then [[ "$SETUP_SHA256" =~ ^[a-f0-9]{64}$ ]]; fi

          api="repos/$GITHUB_REPOSITORY"
          gh api "$api/actions/runs/$BUILD_RUN_ID" | jq -e --arg source "$SOURCE_SHA" '
            .head_sha == $source and .head_branch == "codex/setup14-release" and
            .head_repository.full_name == "ABDO-TECK/pos-desktop" and
            .workflow_id == 389863444 and .path == ".github/workflows/windows-setup.yml" and
            .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success"
          '
          gh api "$api/actions/runs/$BUILD_RUN_ID/jobs" | jq -e '
            [.jobs[] | select(.name == "build" and .conclusion == "success") |
              .steps[] | select(.conclusion == "success") | .name] as $steps |
            [
              "Inspect package and installer metadata",
              "Verify actual Setup install, upgrade, uninstall and fresh reinstall",
              "Verify true upgrade from original 0.0.1 baseline to new Setup",
              "Verify true upgrade from original 0.0.11 baseline to new Setup",
              "Verify upgrade from published Setup 0.0.13 to Setup 0.0.14",
              "Start packaged app on the clean runner",
              "Upload verified installer assets"
            ] - $steps == []
          '
          gh api "$api/actions/artifacts/$ARTIFACT_ID" | jq -e \
            --arg source "$SOURCE_SHA" --arg digest "sha256:$ARTIFACT_SHA256" --argjson run "$BUILD_RUN_ID" '
              .name == "windows-setup" and .expired == false and .digest == $digest and
              .workflow_run.id == $run and .workflow_run.head_sha == $source
            '
          gh api "$api/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/windows-setup.zip"
          printf '%s  %s\n' "$ARTIFACT_SHA256" "$RUNNER_TEMP/windows-setup.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/windows-setup.zip" -d "$RUNNER_TEMP/setup-assets"

      - name: Check out the verified build source and the release publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          path: build-source
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: publishing
          persist-credentials: false
          sparse-checkout: scripts/publish-setup-release.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify installer bytes, metadata and complete release asset set
        working-directory: build-source
        env:
          GH_TOKEN: ${{ github.token }}
          SETUP_VERIFY_ONLY: 'true'
        run: |
          set -euo pipefail
          export SETUP_SHA256="${SETUP_SHA256:-$(sha256sum "$RUNNER_TEMP/setup-assets/POS-Desktop-Setup-0.0.14.exe" | cut -d ' ' -f 1)}"
          node ../publishing/scripts/publish-setup-release.mjs "$RUNNER_TEMP/setup-assets"
          printf '### Verified stable Setup 0.0.14\n\n- Build run %s\n- Source `%s`\n- Artifact %s\n- Setup SHA-256 `%s`\n' \
            "$BUILD_RUN_ID" "$SOURCE_SHA" "$ARTIFACT_ID" "$SETUP_SHA256" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the verified archive as stable and latest
        if: inputs.publish
        working-directory: build-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          release_count=$(gh api --paginate "$api/releases" --jq '.[] | select(.tag_name == "v0.0.14") | .id' | wc -l)
          [[ "$release_count" == 0 ]]
          tag_ref="$api/git/ref/tags/$RELEASE_TAG"
          if ! tag=$(gh api "$tag_ref"); then
            tag=$(gh api --method POST "$api/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_SHA")
          fi
          jq -e --arg source "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $source' <<< "$tag"
          node ../publishing/scripts/publish-setup-release.mjs "$RUNNER_TEMP/setup-assets"
          gh api "$api/releases/latest" | jq -e '.tag_name == "v0.0.14" and .draft == false and .prerelease == false'
