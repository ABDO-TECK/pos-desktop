name: Shell Native Broker Auth Verifier

on:
  workflow_dispatch:
  push:
    branches:
      - feat-shell-delta-updates
    paths:
      - 'backend/Native/NativeBrokerManifestVerifier.cs'
      - 'scripts/verify-shell-native-broker-auth.ps1'
      - '.github/workflows/shell-native-broker-auth.yml'

permissions:
  contents: read

concurrency:
  group: shell-native-broker-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-native-broker-auth:
    name: Verify Native Broker Manifest Verifier (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run native broker manifest verifier tests
        shell: pwsh
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify-shell-native-broker-auth.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
