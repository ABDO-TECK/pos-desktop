name: Windows Setup release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified Setup (leave false for validation)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: release
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/release-metadata.mjs "$RELEASE_TAG"
  build:
    needs: metadata
    if: needs.metadata.outputs.mode == 'setup'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mysqli, gd, mbstring, dom, xml, xmlwriter, zip, openssl, phar, sqlite3
          coverage: none
      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix frontend ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          composer install --working-dir=backend --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Validate and build application source
        shell: pwsh
        run: |
          node scripts/validate-release-source.mjs --mode working-tree --root .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            node scripts/validate-release-source.mjs --mode full --root . --tag $env:GITHUB_REF_NAME --release-channel '${{ needs.metadata.outputs.channel }}'
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          npm --prefix frontend run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run frontend:build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build:phar
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          php scripts/verify-phar-runtime.php
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify stable and beta delta flows in isolated deployments
        shell: pwsh
        run: |
          php scripts/verify-update-execution-budget.php
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-update-http-timeout.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-release-identity.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-update-notifications.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          php scripts/verify-release-channels.php
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-update-channel-policy.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-delta-flow.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Cache pinned vendor archives
        uses: actions/cache@v4
        with:
          path: |
            build-tools/desktop-runtime-downloads
            build-tools/qz-tray-2.2.6-x86_64.exe
          key: windows-portable-${{ hashFiles('scripts/desktop-runtime.json') }}
      - name: Prepare portable PHP, MariaDB, Java and QZ Tray
        shell: pwsh
        run: |
          npm run prepare:desktop-runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run prepare:print-runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run verify:desktop-runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows x64 Setup
        shell: pwsh
        run: npm run electron:build -- --x64
      - name: Inspect package and installer metadata
        shell: pwsh
        run: |
          node scripts/verify-desktop-runtime.mjs --root dist-electron/win-unpacked/resources/portable --strict
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-installer-package.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $tag = "v$((Get-Content package.json -Raw | ConvertFrom-Json).version)"
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          ./scripts/verify-desktop-release.ps1 -ReleaseDirectory dist-electron -Tag $tag
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Start packaged app on the clean runner
        shell: pwsh
        run: ./scripts/smoke-packaged-app.ps1
      - name: Record exact installed artifact inventory
        shell: pwsh
        run: php scripts/build-deployment-inventory.php --root=dist-electron/win-unpacked/resources/app.asar.unpacked --source-root=. --output=dist-electron/deployment-inventory.json
      - name: Upload verified installer assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            dist-electron/POS-Desktop-Setup-*.exe
            dist-electron/POS-Desktop-Setup-*.exe.blockmap
            dist-electron/latest*.yml
            dist-electron/beta.yml
            dist-electron/rc.yml
            dist-electron/deployment-inventory.json
            dist-electron/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.publish
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: release-assets
      - name: Publish verified Setup on its release channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail
          node scripts/write-setup-release-notes.mjs > release-notes.md
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease --latest=false); else flags+=(--latest); fi
          gh release create "$RELEASE_TAG" release-assets/* --repo "$REPOSITORY" --verify-tag --title "POS Desktop $RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
