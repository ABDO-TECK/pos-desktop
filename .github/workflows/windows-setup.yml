name: Windows Setup and first release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mysqli, gd, mbstring, dom, xml, xmlwriter, zip, openssl, phar, sqlite3
          coverage: none
      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix frontend ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          composer install --working-dir=backend --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Validate and build application source
        shell: pwsh
        run: |
          node scripts/validate-release-source.mjs --mode working-tree --root .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            node scripts/validate-release-source.mjs --mode full --root . --tag $env:GITHUB_REF_NAME --release-channel prerelease
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          npm --prefix frontend run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run frontend:build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build:phar
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          php scripts/verify-phar-runtime.php
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare portable PHP, MariaDB, Java and QZ Tray
        shell: pwsh
        run: |
          npm run prepare:desktop-runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run prepare:print-runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run verify:desktop-runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows x64 Setup
        shell: pwsh
        run: npm run electron:build -- --x64
      - name: Inspect package and installer metadata
        shell: pwsh
        run: |
          node scripts/verify-desktop-runtime.mjs --root dist-electron/win-unpacked/resources/portable --strict
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-installer-package.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $tag = "v$((Get-Content version.json -Raw | ConvertFrom-Json).version)"
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          ./scripts/verify-desktop-release.ps1 -ReleaseDirectory dist-electron -Tag $tag
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Start packaged app on the clean runner
        shell: pwsh
        run: ./scripts/smoke-packaged-app.ps1
      - name: Upload verified installer assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            dist-electron/POS-Desktop-Setup-*.exe
            dist-electron/POS-Desktop-Setup-*.exe.blockmap
            dist-electron/latest*.yml
            dist-electron/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: release-assets
      - name: Publish first verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-assets/* --repo "$REPOSITORY" --verify-tag --title "POS Desktop $RELEASE_TAG" --notes-file .github/first-release-notes.md --prerelease
