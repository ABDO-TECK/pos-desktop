name: Windows Setup release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Direct publication is disabled. Leave false to stage a verified Setup.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - id: release
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/release-metadata.mjs "$RELEASE_TAG"
  build:
    needs: metadata
    if: needs.metadata.outputs.mode == 'setup'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Refuse legacy direct publication input
        if: ${{ inputs.publish }}
        shell: pwsh
        run: |
          Write-Error "Direct publication from windows-setup.yml is disabled. Use the Setup promotion workflow after release acceptance."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mysqli, gd, mbstring, dom, xml, xmlwriter, zip, openssl, phar, sqlite3, pdo_sqlite
          coverage: none
      - name: Install locked dependencies
        shell: pwsh
        env:
          COMPOSER_MAX_PARALLEL_HTTP: '1'
          COMPOSER_MAX_PARALLEL_PROCESSES: '1'
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix frontend ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          composer install --working-dir=backend --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Validate release readiness and source
        shell: pwsh
        env:
          SETUP_TAG: ${{ needs.metadata.outputs.tag }}
          SETUP_CHANNEL: ${{ needs.metadata.outputs.channel }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:SETUP_TAG -eq 'v0.0.13') {
            node scripts/verify-setup13-release-readiness.mjs
            node scripts/verify-setup13-promotion-policy.mjs
          } elseif ($env:SETUP_TAG -eq 'v0.0.14' -and $env:SETUP_CHANNEL -eq 'stable') {
            $reviewedSource = '6e49915aad7efb71145d3226595f777ed43f9116'
            $publishedBaseline = 'ee5bf691c4acf6ffcd7730db1d7d0ed24f274787'
            if ((git rev-parse 'v0.0.13^{}') -cne $publishedBaseline) {
              throw 'The Setup 0.0.13 tag no longer matches its published source.'
            }
            git merge-base --is-ancestor $publishedBaseline $reviewedSource
            git merge-base --is-ancestor $reviewedSource HEAD
            $releaseFiles = @(
              'version.json', 'package.json', 'package-lock.json', 'frontend/package.json',
              'frontend/package-lock.json', '.github/workflows/windows-setup.yml',
              '.github/workflows/promote-setup.yml', 'scripts/verify-original-setup-upgrade.ps1',
              'scripts/verify-setup-recovery.mjs'
            )
            $changed = @(git diff --name-only $reviewedSource HEAD | Where-Object { $_ -cnotin $releaseFiles })
            if ($changed.Count) { throw "Unexpected changes to reviewed source: $($changed -join ', ')" }
            foreach ($file in $releaseFiles[1..4]) {
              $baseline = (git show "${reviewedSource}:$file") -join "`n"
              $candidate = (Get-Content -LiteralPath $file) -join "`n"
              if ($candidate -cne ($baseline -replace '"version": "0\.0\.13"', '"version": "0.0.14"')) {
                throw "$file differs from the reviewed manifest beyond the Setup version."
              }
            }
          } else {
            throw "Unsupported Setup release identity: $env:SETUP_TAG ($env:SETUP_CHANNEL)."
          }
          node scripts/validate-release-source.mjs --mode working-tree --root .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            node scripts/validate-release-source.mjs --mode full --root . --tag '${{ needs.metadata.outputs.tag }}' --release-channel '${{ needs.metadata.outputs.channel }}'
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          npm --prefix frontend run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run frontend:build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build:phar
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          php scripts/verify-phar-runtime.php
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Cache pinned vendor archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build-tools/desktop-runtime-downloads
            build-tools/qz-tray-2.2.6-x86_64.exe
          key: windows-portable-${{ hashFiles('scripts/desktop-runtime.json') }}
      - name: Prepare portable PHP, MariaDB, Java and QZ Tray
        shell: pwsh
        run: |
          ./scripts/prepare-desktop-runtime.ps1
          ./scripts/prepare-print-runtime.ps1
          npm run verify:desktop-runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify stable and beta delta flows in isolated deployments
        shell: pwsh
        run: |
          php scripts/verify-update-execution-budget.php
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-update-http-timeout.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-release-identity.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/verify-uninstall-data.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-qz-upgrade.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-update-notifications.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          php scripts/verify-release-channels.php
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-update-channel-policy.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-delta-flow.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-delta-handoff-recovery.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/verify-delta-handoff-windows.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          php scripts/verify-catalog-trigger-recovery.php
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          php scripts/verify-admin-update-center.php
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-admin-update-center.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-admin-update-ui.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows x64 Setup
        shell: pwsh
        run: npm run electron:build -- --x64
      - name: Inspect package and installer metadata
        shell: pwsh
        env:
          SETUP_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          node scripts/verify-desktop-runtime.mjs --root dist-electron/win-unpacked/resources/portable --strict
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-installer-package.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-setup-recovery.mjs $env:SETUP_TAG
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $tag = "v$((Get-Content package.json -Raw | ConvertFrom-Json).version)"
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          ./scripts/verify-desktop-release.ps1 -ReleaseDirectory dist-electron -Tag $tag
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Record exact installed artifact inventory
        shell: pwsh
        run: |
          php scripts/build-deployment-inventory.php --root=dist-electron/win-unpacked/resources/app.asar.unpacked --source-root=. --output=dist-electron/deployment-inventory.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Finalize SHA256SUMS.txt covering all release assets
        shell: pwsh
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const out = path.join(process.cwd(), 'dist-electron');
            const v = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const setup = 'POS-Desktop-Setup-' + v + '.exe';
            const metadata = v.includes('-beta.') ? 'beta.yml' : 'latest.yml';
            const files = [setup, setup + '.blockmap', metadata, 'deployment-inventory.json'];
            for (const f of files) {
              if (!fs.existsSync(path.join(out, f))) throw new Error('Missing release artifact before checksums: ' + f);
            }
            const checksums = files.map(f => {
              const hash = crypto.createHash('sha256').update(fs.readFileSync(path.join(out, f))).digest('hex');
              return hash + '  ' + f;
            }).join('\n') + '\n';
            fs.writeFileSync(path.join(out, 'SHA256SUMS.txt'), checksums);
            console.log('Finalized SHA256SUMS.txt covering all 4 release artifacts.');
          "
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify actual Setup install, upgrade, uninstall and fresh reinstall
        shell: pwsh
        run: |
          ./scripts/verify-installer-lifecycle.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Save installer acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-acceptance
          path: ${{ runner.temp }}/pos-installer-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify true upgrade from original 0.0.1 baseline to new Setup
        shell: pwsh
        run: |
          ./scripts/verify-original-setup-upgrade.ps1 -BaselineVersion 0.0.1 -EvidenceName pos-upgrade-evidence-0.0.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Save 0.0.1 upgrade acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-acceptance-0.0.1
          path: ${{ runner.temp }}/pos-upgrade-evidence-0.0.1
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify true upgrade from original 0.0.11 baseline to new Setup
        shell: pwsh
        run: |
          ./scripts/verify-original-setup-upgrade.ps1 -BaselineVersion 0.0.11 -EvidenceName pos-upgrade-evidence-0.0.11
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Save 0.0.11 upgrade acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-acceptance-0.0.11
          path: ${{ runner.temp }}/pos-upgrade-evidence-0.0.11
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify upgrade from published Setup 0.0.13 to Setup 0.0.14
        if: needs.metadata.outputs.tag == 'v0.0.14'
        shell: pwsh
        run: ./scripts/verify-original-setup-upgrade.ps1 -BaselineVersion 0.0.13 -EvidenceName pos-upgrade-evidence-0.0.13
      - name: Save 0.0.13 upgrade acceptance evidence
        if: ${{ always() && needs.metadata.outputs.tag == 'v0.0.14' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-acceptance-0.0.13
          path: ${{ runner.temp }}/pos-upgrade-evidence-0.0.13
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify future delta upgrade smoke on packaged Setup 0.0.13
        if: needs.metadata.outputs.tag == 'v0.0.13'
        shell: pwsh
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          node scripts/verify-setup12-delta-upgrade.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Save delta smoke acceptance evidence
        if: ${{ always() && needs.metadata.outputs.tag == 'v0.0.13' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delta-smoke-acceptance
          path: ${{ runner.temp }}/setup12-delta-upgrade-lab/evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Start packaged app on the clean runner
        shell: pwsh
        run: |
          ./scripts/smoke-packaged-app.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload verified installer assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-setup
          path: |
            dist-electron/POS-Desktop-Setup-*.exe
            dist-electron/POS-Desktop-Setup-*.exe.blockmap
            dist-electron/latest*.yml
            dist-electron/beta.yml
            dist-electron/deployment-inventory.json
            dist-electron/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
