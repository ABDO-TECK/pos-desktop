name: Shell Native Worker Image Set Verifier

on:
  workflow_dispatch:
  push:
    branches:
      - feat-shell-delta-updates
      - codex/shell-worker-image-set
    paths:
      - 'backend/Native/NativeBrokerWorkerImageSet.cs'
      - 'backend/Native/WorkerImageReadLease.cs'
      - 'backend/Native/OwnedChildProcess.cs'
      - 'backend/Native/OwnedWorkerPipeEndpoint.cs'
      - 'backend/Native/NativeBrokerManifestVerifier.cs'
      - 'backend/Native/NativeBrokerContextBinding.cs'
      - 'backend/Services/ShellDeltaWorkerPlanSessionService.php'
      - 'backend/Services/ShellDeltaWorkerPipeTransportService.php'
      - 'backend/Services/ShellDeltaWorkerFilePlanService.php'
      - 'backend/Services/ShellDeltaManifestService.php'
      - 'backend/Services/ProductInventoryService.php'
      - 'backend/Services/ProductInventory.php'
      - 'backend/Services/UpdateChannelPolicy.php'
      - 'backend/Services/UpdateDataCompatibilityService.php'
      - 'backend/Services/ManifestSignatureService.php'
      - 'backend/cli/shell-worker-plan.php'
      - 'backend/composer.json'
      - 'backend/composer.lock'
      - 'build-phar.php'
      - 'scripts/create-shell-native-worker-image-set-fixture.php'
      - 'scripts/verify-shell-native-worker-image-set.ps1'
      - '.github/workflows/shell-native-worker-image-set.yml'

permissions:
  contents: read

concurrency:
  group: shell-native-worker-image-set-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-native-worker-image-set:
    name: Verify Win32 Native Worker Image Set Leases (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip, openssl, mbstring, gd
          ini-values: phar.readonly=0

      - name: Install backend dependencies
        shell: pwsh
        run: |
          composer install --no-dev --prefer-dist --no-progress --no-interaction --no-scripts --working-dir=backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile backend.phar
        shell: pwsh
        run: |
          php -d phar.readonly=0 build-phar.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate native worker image set fixture and payload root
        shell: pwsh
        run: |
          $fixturePath = Join-Path $env:RUNNER_TEMP "native-worker-image-set-fixtures.json"
          $phpExe = (Get-Command php).Source
          $phpDir = Split-Path $phpExe -Parent
          $backendPhar = Join-Path (Get-Location) "backend\backend.phar"
          php -d phar.readonly=0 scripts/create-shell-native-worker-image-set-fixture.php --output "$fixturePath" --backend-phar "$backendPhar" --php-dir "$phpDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Win32 native worker image set lease verifier
        shell: pwsh
        run: |
          $fixturePath = Join-Path $env:RUNNER_TEMP "native-worker-image-set-fixtures.json"
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify-shell-native-worker-image-set.ps1 -FixtureFile "$fixturePath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
