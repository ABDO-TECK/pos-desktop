name: Shell Native Worker Pipe Framing Verifier

on:
  workflow_dispatch:
  push:
    branches:
      - feat-shell-delta-updates
    paths:
      - 'backend/Native/OwnedWorkerPipeEndpoint.cs'
      - 'backend/Native/OwnedChildProcess.cs'
      - 'scripts/verify-shell-native-worker-pipe-framing.ps1'
      - '.github/workflows/shell-native-worker-pipe-framing.yml'

permissions:
  contents: read

concurrency:
  group: shell-native-worker-pipe-framing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-native-worker-pipe-framing:
    name: Verify Win32 Native Worker Pipe Framing Transport (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Win32 native worker pipe framing verifier
        shell: pwsh
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify-shell-native-worker-pipe-framing.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
