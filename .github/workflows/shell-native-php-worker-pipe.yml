name: Shell Native Worker Pipe PHP Integration Verifier

on:
  workflow_dispatch:
  push:
    branches:
      - feat-shell-delta-updates
    paths:
      - 'backend/Native/OwnedWorkerPipeEndpoint.cs'
      - 'backend/Native/OwnedChildProcess.cs'
      - 'backend/Native/NativeBrokerManifestVerifier.cs'
      - 'backend/Native/NativeBrokerContextBinding.cs'
      - 'backend/Services/ShellDeltaWorkerPipeTransportService.php'
      - 'backend/Services/ShellDeltaWorkerFilePlanService.php'
      - 'backend/Services/ShellDeltaManifestService.php'
      - 'backend/Services/ProductInventoryService.php'
      - 'backend/Services/ProductInventory.php'
      - 'backend/Services/UpdateChannelPolicy.php'
      - 'backend/Services/UpdateDataCompatibilityService.php'
      - 'backend/Services/ManifestSignatureService.php'
      - 'backend/composer.json'
      - 'backend/composer.lock'
      - 'scripts/create-shell-native-broker-binding-fixtures.php'
      - 'scripts/shell-worker-pipe-php-client-fixture.php'
      - 'scripts/verify-shell-native-php-worker-pipe.ps1'
      - '.github/workflows/shell-native-php-worker-pipe.yml'

permissions:
  contents: read

concurrency:
  group: shell-native-php-worker-pipe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-native-php-worker-pipe:
    name: Verify Win32 Native Worker Pipe PHP Integration (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip, openssl, mbstring, gd

      - name: Install backend dependencies
        shell: pwsh
        run: |
          composer install --no-dev --prefer-dist --no-progress --no-interaction --no-scripts --working-dir=backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate native broker binding fixtures
        shell: pwsh
        run: |
          $fixturePath = Join-Path $env:RUNNER_TEMP "native-broker-binding-fixtures.json"
          php scripts/create-shell-native-broker-binding-fixtures.php --output "$fixturePath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run native PHP worker pipe verification
        shell: pwsh
        run: |
          $fixturePath = Join-Path $env:RUNNER_TEMP "native-broker-binding-fixtures.json"
          $phpExe = (Get-Command php).Source
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify-shell-native-php-worker-pipe.ps1 -FixtureFile "$fixturePath" -PhpPath "$phpExe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
