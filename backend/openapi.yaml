components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: رمز الوصول المستلم من `/login`

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: معرف العنصر
    SearchParam:
      name: search
      in: query
      schema:
        type: string
      description: نص البحث
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
      description: رقم الصفحة
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
      description: عدد العناصر لكل صفحة

  schemas:
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: success

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
        errors:
          type: object
          additionalProperties: true

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    Supplier:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        initial_balance:
          type: number
        balance:
          type: number
        total_debit:
          type: number
        total_credit:
          type: number

    Customer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        balance:
          type: number

    Expense:
      type: object
      properties:
        id:
          type: integer
        category_id:
          type: integer
        category_name:
          type: string
        user_id:
          type: integer
        user_name:
          type: string
        amount:
          type: number
        notes:
          type: string
          nullable: true
        expense_date:
          type: string
          format: date

    ExpenseCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    AuthUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, cashier]
        force_password_change:
          type: integer
          enum: [0, 1]

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, cashier]
        is_active:
          type: integer
        force_password_change:
          type: integer
        created_at:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [admin, cashier]
        is_active:
          type: integer
          enum: [0, 1]

    UserUpdateInput:
      allOf:
        - $ref: '#/components/schemas/UserInput'
        - type: object
          properties:
            current_password:
              type: string
              description: Required when the authenticated user changes their own password.

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        barcode:
          type: string
          nullable: true
        price:
          type: number
        cost:
          type: number
        quantity:
          type: integer
        min_quantity:
          type: integer
        category_id:
          type: integer
          nullable: true
        category_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    ProductInput:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          example: منتج جديد
        barcode:
          type: string
          nullable: true
        price:
          type: number
          minimum: 0
          example: 25.50
        cost:
          type: number
          minimum: 0
          example: 15.00
        quantity:
          type: integer
          minimum: 0
          default: 0
        min_quantity:
          type: integer
          minimum: 0
          default: 5
        category_id:
          type: integer
          nullable: true

    Invoice:
      type: object
      properties:
        id:
          type: integer
        invoice_number:
          type: string
        total:
          type: number
        discount:
          type: number
        tax:
          type: number
        shipping_cost:
          type: number
        net_total:
          type: number
        payment_method:
          type: string
          enum: [cash, card, vodafone_cash, instapay, other_wallet, credit]
        status:
          type: string
          enum: [completed, reserved, cancelled]
        user_id:
          type: integer
        user_name:
          type: string
        customer_id:
          type: integer
          nullable: true
        items:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
              product_name:
                type: string
              quantity:
                type: integer
              price:
                type: number
              cost:
                type: number
              total:
                type: number
        created_at:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: غير مصرح — رمز الوصول مفقود أو منتهي الصلاحية
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: العنصر غير موجود
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: خطأ في التحقق من البيانات
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

security:
  - bearerAuth: []
